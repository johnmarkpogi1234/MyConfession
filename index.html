<body>

<script>
"use strict";

/* ---------- data layer: talks to /api/confess (Vercel + Redis); owner tokens kept in this browser ---------- */

/* ---------- background hearts / theme ---------- */
(()=>{const bg=$('#bg');if(reduce)return;for(let i=0;i<14;i++){const s=el('span',{},['❤','💗','💖','✨'][i%4]);s.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*22}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;bg.append(s)}})();

/* ---------- celebration ---------- */

  el('div',{class:'card',style:'max-width:640px;margin:18px auto'},
   el('div',{class:'grid2'},inp('creatorName','Your name','Mark',0,40),inp('recipientName','Their name','Sarah',0,40)),
   inp('nickname','Nickname','e.g. Sarsar',1,40),inp('greeting','Custom greeting','There\u2019s something I\u2019ve been wanting to tell you\u2026',1,120),
   inp('message','Your confession','I\u2019ve been wanting to tell you this for a while. I really like you\u2026',0,1200,1),

  el('p',{style:'color:var(--mut)'},'Anyone with this link can view your confession.'),box,
  el('div',{class:'row'},el('button',{class:'btn',onclick:copy},'📋 Copy Link'),el('button',{class:'btn',onclick:share},'📤 Share')),qr,
  el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>renderConfession(c,{preview:true,back:'done/'+id})},'👀 Preview'),el('button',{class:'btn ghost',onclick:()=>{draft={};go('create')}},'➕ Create Another'),el('button',{class:'btn ghost',onclick:()=>go('mine')},'My confessions'))))}

function pageMine(){const list=Mine.all();const box=el('div',{class:'card',style:'max-width:680px;margin:18px auto'});

  box.append(el('div',{class:'item'},el('div',{},el('strong',{},'For '+c.recipientName),st),el('div',{class:'row',style:'margin:0'},el('button',{class:'btn ghost sm',onclick:()=>go('done/'+c.id)},'Link'),
   el('button',{class:'btn ghost sm',onclick:async()=>{if(!confirm('Delete this confession? Its link will stop working.'))return;try{await API.del(c.id,c.token);Mine.remove(c.id);pageMine()}catch{toast('Couldn\u2019t delete, try again')}}},'Delete'))));
  API.get(c.id,c.token).then(r=>{st.textContent=(!r?'Link no longer active':r.response==='yes'?'They said YES! 🎉':'Waiting for response ❤️')+' · '+new Date(c.createdAt).toLocaleDateString();if(r&&r.reply)st.append(' · 💌 '+r.reply)}).catch(()=>{st.textContent='Couldn\u2019t check status'})});

/* ---------- recipient experience ---------- */
